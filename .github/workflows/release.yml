name: Release theme

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run verify

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $manifestVersion = (Get-Content -LiteralPath komari-theme.json -Raw | ConvertFrom-Json).version
          $packageVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($manifestVersion -ne $packageVersion) {
            throw "komari-theme.json ($manifestVersion) 与 package.json ($packageVersion) 版本不一致"
          }
          if ($env:GITHUB_REF_NAME -ne "v$manifestVersion") {
            throw "标签 $env:GITHUB_REF_NAME 必须与版本 v$manifestVersion 一致"
          }

      - name: Build theme package
        run: npm run package:theme

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: komari-theme-minecraft-${{ github.ref_name }}
          path: release/komari-theme-minecraft-v*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/komari-theme-minecraft-v*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
